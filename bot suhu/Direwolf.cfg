############################################################
# direwolf.cfg - Konfigurasi Dire Wolf untuk UTS APRS Telemetry
# Callsign : YD3ADB-7
# Fungsi   : menerima telemetry dari bot melalui KISS TCP dan memodulasi audio
############################################################

# --- Identitas stasiun ---
MYCALL YD3ADB-7

# --- Perangkat audio ---
# Input tidak digunakan; output diarahkan ke perangkat audio Windows yang diberikan.
# Output ini harus terhubung ke input audio radio melalui interface yang sesuai.
ADEVICE null "Speakers (High Definition Audio Device)"

# --- Modem (APRS standar 144.390 MHz / VHF memakai 1200 baud) ---
CHANNEL 0
MODEM 1200
KISSPORT 8001
AGWPORT 0

# PTT radio belum disetel. Tanpa interface PTT atau VOX yang benar,
# Direwolf hanya menghasilkan audio dan radio tidak akan otomatis transmit.